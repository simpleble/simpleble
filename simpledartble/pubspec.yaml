name: simpledartble
description: >-
  SimpleBLE for Dart. Discover and connect Bluetooth peripherals, read and write GATT values, subscribe to
  notifications, and host local GATT services through one API.
version: 1.3.1-dev
homepage: https://simpleble.org
repository: https://github.com/simpleble/simpleble
issue_tracker: https://github.com/simpleble/simpleble/issues
documentation: https://docs.simpleble.org/simpledartble/usage
topics:
  - bluetooth
  - ble
  - ffi

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  meta: ^1.16.0

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.1.0
  test: ^1.31.0
  vm_service: ^15.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

# NOTE: Only the root package's user-defines apply, so this builds the PLAIN
# backend for this package's own tests and never for apps depending on it.
hooks:
  user_defines:
    simpledartble:
      backend: plain
