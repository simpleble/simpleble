[package]
edition = "2021"

name = "simplersble"
version = "1.3.0"
rust-version = "1.82"
license = "BUSL-1.1"
description = "Rust bindings for the cross-platform SimpleBLE Bluetooth Low Energy library, for Windows, macOS, and Linux. Free for non-commercial use; commercial use requires a license."
readme = "simplersble/README.md"
repository = "https://github.com/simpleble/simpleble"

include = [
    "/LICENSE.md",
    "/VERSION",
    "/cmake",
    "/dependencies",
    "/simpleble",
    "/simplebluez",
    "/simpledbus",
    "/simplersble/README.md",
    "/simplersble/build.rs",
    "/simplersble/src",
]

build = "simplersble/build.rs"
links = "simpleble"

[lib]
path = "simplersble/src/lib.rs"

# Runs against the simulated backend: SIMPLERSBLE_PLAIN=1 cargo test
[[test]]
name = "plain"
path = "simplersble/tests/plain.rs"

[dependencies]
cxx = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
futures = "0.3"

[build-dependencies]
cmake = "0.1"
cxx-build = "1.0"
