name: simpleflutterble
description: >-
  SimpleBLE for Flutter. Discover and connect Bluetooth peripherals, read and write GATT values, subscribe
  to notifications, and host GATT services on Android, iOS, and desktop.
version: 1.2.1
homepage: https://simpleble.org
repository: https://github.com/simpleble/simpleble
issue_tracker: https://github.com/simpleble/simpleble/issues
documentation: https://docs.simpleble.org/simpleflutterble/usage
topics:
  - bluetooth
  - ble
  - flutter

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

# NOTE: SimpleFlutterBLE re-exports SimpleDartBLE's API. Its Android module and
# SimpleDartBLE's native library call each other, so both packages always have
# the same version.
dependencies:
  flutter:
    sdk: flutter
  simpledartble: 1.2.1

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

# NOTE: The Android module loads SimpleDartBLE's native library from Java, so
# SimpleBLE's Android backend gets the JVM and the application context. On the
# other platforms, SimpleDartBLE's build hook is all Flutter needs.
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
