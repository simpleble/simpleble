org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Set to true to build every native library against the PLAIN backend, for the tests.
simplektble.plain=false
# The Apple source set uses the SimpleCBLE bindings, which must be shared between the Apple targets.
kotlin.mpp.enableCInteropCommonization=true
