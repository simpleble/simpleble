[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleaible"
version = "1.3.0"
description = "An MCP server, HTTP API, and agent skills that let AI agents use Bluetooth Low Energy devices through SimpleBLE. Free for non-commercial use; commercial use requires a license."
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.10"
authors = [{ name = "Kevin Dewald", email = "kevin@simpleble.org" }]
urls = { Homepage = "https://github.com/simpleble/simpleble" }
keywords = ["ble", "bluetooth", "mcp", "ai", "simpleble"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "simplepyble",
    "fastmcp",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.scripts]
simpleaible-mcp = "simpleaible.mcp:main"
simpleaible-http = "simpleaible.http:main"
simpleaible = "simpleaible.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simpleaible = [
    "py.typed",
    "skills/*/SKILL.md",
    "skills/*/references/*.md",
]
