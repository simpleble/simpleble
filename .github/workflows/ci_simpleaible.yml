name: Build SimpleAIBLE

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add Version Suffix
        uses: ./.github/actions/setup-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: "pip"

      - name: Install dependencies
        run: pip install build

      - name: Add License
        run: cp LICENSE.md simpleaible/LICENSE.md

      - name: Attribute README links to PyPI
        run: sed -i 's/utm_source=github/utm_source=pypi_simpleaible/g' simpleaible/README.md

      - name: Build
        run: python3 -m build simpleaible

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: simpleaible-sdist
          path: simpleaible/dist/*.tar.gz

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: simpleaible-wheel
          path: simpleaible/dist/*.whl
