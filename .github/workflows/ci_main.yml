name: CI Main

permissions:
  contents: read

on:
  workflow_dispatch:
  # Stable builds are triggered by publishing a GitHub release. Running CI for
  # tag pushes only duplicates that work.
  push:
    branches:
      - "**"
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # This job is used to detect duplicate runs and skip one of them
  # (For example when pushing a commit to an open pull request)
  # See: https://github.com/fkirc/skip-duplicate-actions?tab=readme-ov-file#skip-concurrent-workflow-runs
  pre_job:
    runs-on: ubuntu-22.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Print event details
        run: |
          echo "This run was triggered by $GITHUB_EVENT_NAME event."
          cat $GITHUB_EVENT_PATH | jq .
      - name: Detect duplicate runs
        id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          # Main and release runs publish packages even if a branch checked the same files.
          concurrent_skipping: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'never' || 'same_content_newer' }}
          skip_after_successful_duplicate: ${{ github.ref != 'refs/heads/main' && github.event_name != 'release' }}
      - name: Print skip reason
        run: |
          echo "Skip reason: ${{ steps.skip_check.outputs.skip_reason }}"
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Perform version check
        run: |
          ./scripts/check_version.sh

  # This job is used to dynamically generate the build matrix of 'build' job in 'ci_linux_internals.yml'.
  # The output variable 'values' is a list of strings: 'simpledbus', 'simplebluez'.
  # This is not inside pre-job because 'changes' variable is set by dorny/paths-filter to ALL the filters
  # that match, so we need to have a job with only these three filters.
  # Note that the filters are defined in a way that makes each of them depend on the previous one.
  # If in main branch, all libraries are listed in the output even if there are no matching changes.
  libraries:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      values: ${{ github.ref == 'refs/heads/main' && '["simpledbus","simplebluez"]' || steps.filter.outputs.changes }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            simpledbus: &simpledbus
              - 'simpledbus/**'
            simplebluez: &simplebluez
              - *simpledbus
              - 'simplebluez/**'

  lint:
    needs: [pre_job]
    if: needs.pre_job.outputs.should_skip != 'true'
    uses: ./.github/workflows/ci_lint.yml

  # docs:
  #   needs: [pre_job]
  #   if: needs.pre_job.outputs.should_skip != 'true'
  #   uses: ./.github/workflows/ci_docs.yml

  smoketest:
    needs: [pre_job]
    if: needs.pre_job.outputs.should_skip != 'true'
    uses: ./.github/workflows/ci_smoketest.yml

  simpleble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simpleble.yml

  simplepyble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simplepyble.yml

  simpleaible:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simpleaible.yml

  simplejavable:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simplejavable.yml

  simpledroidble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simpledroidble.yml

  simplecble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simplecble.yml

  simplersble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simplersble.yml

  simplesharpble:
    needs: [simplecble]
    uses: ./.github/workflows/ci_simplesharpble.yml

  simplegoble:
    needs: [simplecble]
    uses: ./.github/workflows/ci_simplegoble.yml

  simplejsble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simplejsble.yml

  simplektble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simplektble.yml

  simplernble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simplernble.yml

  simpleswiftble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simpleswiftble.yml

  # SimpleDartBLE is published by publish_simpledartble.yml, as pub.dev only
  # accepts uploads for tag pushes.
  simpledartble:
    needs: [smoketest]
    uses: ./.github/workflows/ci_simpledartble.yml

  linux-internals:
    needs: [smoketest, libraries]
    if: ${{ needs.libraries.outputs.values != '[]' && needs.libraries.outputs.values != '' }}
    uses: ./.github/workflows/ci_linux_internals.yml
    with:
      libraries: ${{ needs.libraries.outputs.values }}

  publish-release:
    needs: [simpleble, simplepyble, simpleaible, simplejavable, simpledroidble, simplecble, simplersble, simplesharpble, simplegoble, simplejsble, simplektble, simplernble, simpleswiftble, simpledartble]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:

      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List all artifacts
        run: find artifacts -type f -ls | sort

      - name: Upload artifacts to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          file: artifacts/**/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  publish-simplepyble:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:

      - name: Install dependencies
        run: pip install twine

      - name: "Download Python Wheels"
        uses: actions/download-artifact@v4
        with:
          pattern: simplepyble-*-*
          path: wheels
          merge-multiple: true

      - name: "Download Python source distribution"
        uses: actions/download-artifact@v4
        with:
          name: simplepyble-sdist
          path: sdist

      - name: Check packages
        run: twine check wheels/*.whl

      - name: Check source distribution
        run: twine check sdist/simplepyble*.tar.gz

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true
          attestations: false # Broken, see: https://github.com/pypa/gh-action-pypi-publish/issues/166

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdist
          skip-existing: true
          attestations: false # Broken, see: https://github.com/pypa/gh-action-pypi-publish/issues/166

  publish-simplesharpble:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download SimpleSharpBLE package
        uses: actions/download-artifact@v4
        with:
          name: SimpleSharpBLE-nuget
          path: packages

      - name: Sign in to NuGet
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  publish-simplegoble:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-22.04
    concurrency:
      group: simplegoble-distribution
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simplegoble-module
          path: go-package
      - uses: actions/checkout@v4
        with:
          repository: simpleble/simplegoble
          ref: main
          path: simplegoble-distribution
          fetch-depth: 0
          ssh-key: ${{ secrets.SIMPLEGOBLE_DEPLOY_KEY }}

      - name: Extract Go module
        run: |
          unzip -q go-package/*.zip -d "$RUNNER_TEMP/simplegoble-unpacked"
          module_file=$(find "$RUNNER_TEMP/simplegoble-unpacked" -name go.mod)
          test -f "$module_file"
          echo "PACKAGE_DIR=$(dirname "$module_file")" >> "$GITHUB_ENV"

      - name: Update distribution and verify immutable version
        working-directory: simplegoble-distribution
        run: |
          version=$(cat "$PACKAGE_DIR/VERSION")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]
          major=${version%%.*}
          module=github.com/simpleble/simplegoble
          if (( major >= 2 )); then module="$module/v$major"; fi
          test "$(head -n 1 "$PACKAGE_DIR/go.mod")" = "module $module"
          test -z "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only tracked generated files are removed; the checkout's Git metadata stays intact.
          git ls-files -z | while IFS= read -r -d '' path; do rm -- "$path"; done
          cp -R "$PACKAGE_DIR/." .
          git add --all
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git write-tree)" != "$(git rev-parse "$tag^{tree}")" ]]; then
              echo "::error::$tag already exists with different contents; published Go versions are immutable."
              exit 1
            fi
            echo "$tag already contains this module; no publication needed."
          else
            git commit -m "Publish SimpleGoBLE $tag"
            git tag "$tag"
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          fi

  # SwiftPM resolves versions from Git tags, so simpleble/simpleswiftble gets a commit and a tag for each version, like
  # simpleble/simplegoble. Its Package.swift points at the xcframework archive attached to the tag's GitHub release.
  publish-simpleswiftble:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: macos-15
    concurrency:
      group: simpleswiftble-distribution
      cancel-in-progress: false
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add Version Suffix
        uses: ./.github/actions/setup-version

      - uses: actions/checkout@v4
        with:
          repository: simpleble/simpleswiftble
          ref: main
          path: simpleswiftble-distribution
          fetch-depth: 0
          token: ${{ secrets.SIMPLESWIFTBLE_TOKEN }}

      - name: Publish the version
        working-directory: simpleswiftble-distribution
        env:
          GH_TOKEN: ${{ secrets.SIMPLESWIFTBLE_TOKEN }}
        run: |
          version=$(tr -d ' \t\n\r' < ../VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.?[0-9]+)?$ ]]
          tag="v$version"
          repo=simpleble/simpleswiftble
          archive="$RUNNER_TEMP/CSimpleBLE.xcframework.zip"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            # NOTE: An earlier attempt may have pushed the tag but left its release a draft.
            gh release edit "$tag" --repo "$repo" --draft=false
            echo "$tag is already published."
            exit 0
          fi
          # NOTE: The archive goes into a draft release before the tag exists. A retried run reuses it, so the checksum
          # in Package.swift stays valid.
          if gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
            gh release download "$tag" --repo "$repo" --pattern CSimpleBLE.xcframework.zip --dir "$RUNNER_TEMP"
          else
            ../simpleswiftble/scripts/build-xcframework.sh
            ditto -c -k --keepParent ../simpleswiftble/build/release/CSimpleBLE.xcframework "$archive"
            prerelease=$([[ "$version" == *-dev* ]] && echo true || echo false)
            gh release create "$tag" "$archive" --repo "$repo" --draft --prerelease="$prerelease" --title "SimpleSwiftBLE $tag" \
              --notes "SimpleSwiftBLE $version, built from simpleble/simpleble@$GITHUB_SHA."
          fi
          # Only tracked files are removed; the checkout's Git metadata stays intact.
          git ls-files -z | while IFS= read -r -d '' path; do rm -- "$path"; done
          # NOTE: SwiftPM's checksum is the archive's SHA-256.
          ../simpleswiftble/scripts/package.sh . "https://github.com/$repo/releases/download/$tag/CSimpleBLE.xcframework.zip" \
            "$(shasum -a 256 "$archive" | cut -d ' ' -f 1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Published SimpleSwiftBLE $tag."
          git tag "$tag"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          gh release edit "$tag" --repo "$repo" --draft=false

  publish-simplejsble:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Download SimpleJSBLE package
        uses: actions/download-artifact@v4
        with:
          name: simplejsble-npm
          path: package

      - name: Publish to npm
        run: |
          # NOTE: Without the leading ./, npm reads package/<file> as a GitHub repository.
          package=$(ls ./package/simplejsble-*.tgz)
          version=$(tar -xOzf "$package" package/package.json | jq -r .version)
          if [[ -n "$(npm view "simplejsble@$version" version 2>/dev/null)" ]]; then
            echo "simplejsble@$version is already published."
            exit 0
          fi
          # Only releases move the latest tag; main builds are development versions.
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then tag=latest; else tag=dev; fi
          npm publish "$package" --tag "$tag" --access public

  publish-simplernble:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Download SimpleRnBLE package
        uses: actions/download-artifact@v4
        with:
          name: simplernble-npm
          path: package

      - name: Publish to npm
        run: |
          # NOTE: Without the leading ./, npm reads package/<file> as a GitHub repository.
          package=$(ls ./package/simplernble-*.tgz)
          version=$(tar -xOzf "$package" package/package.json | jq -r .version)
          if [[ -n "$(npm view "simplernble@$version" version 2>/dev/null)" ]]; then
            echo "simplernble@$version is already published."
            exit 0
          fi
          # Only releases move the latest tag; main builds are development versions.
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then tag=latest; else tag=dev; fi
          npm publish "$package" --tag "$tag" --access public

  publish-simpleaible:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:

      - name: Install dependencies
        run: pip install twine

      - name: "Download SimpleAIBLE artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: simpleaible-*
          path: dist
          merge-multiple: true

      - name: Check packages
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          attestations: false

  publish-simplejavable:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-22.04
    steps:

      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add Version Suffix
        uses: ./.github/actions/setup-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: "Download JNI Binaries"
        uses: actions/download-artifact@v4
        with:
          pattern: 'libsimplejavable*'
          path: 'jni_download'

      - name: Rename JNI Directories
        working-directory: ${{ github.workspace }}/jni_download
        run: |
          mkdir -p $GITHUB_WORKSPACE/jni
          for dir in libsimplejavable_*; do
            arch=$(echo "$dir" | sed 's/.*-//')
            target_dir="$GITHUB_WORKSPACE/jni/$arch"
            mkdir -p "$target_dir"
            mv -v "$dir"/* "$target_dir/"
            rmdir "$dir"
          done

      - name: Publish SimpleJavaBLE to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          utils/gradle/gradlew -p simplejavable/java -PnativeLibPath=$GITHUB_WORKSPACE/jni --no-daemon publishAndReleaseToMavenCentral

  publish-simpledroidble:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-22.04
    steps:

      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add Version Suffix
        uses: ./.github/actions/setup-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish SimpleDroidBLE to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          ./simpledroidble/gradlew -p ./simpledroidbridge --no-daemon publishAndReleaseToMavenCentral
          ./simpledroidble/gradlew -p ./simpledroidble --no-daemon :simpledroidble:publishAndReleaseToMavenCentral

  publish-simplektble:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    # Apple targets build only on macOS, and every target is published from one build.
    runs-on: macos-15
    steps:

      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add Version Suffix
        uses: ./.github/actions/setup-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download JNI Libraries
        uses: actions/download-artifact@v4
        with:
          pattern: 'libsimplektble-jni_*'
          path: jni_download

      - name: Arrange JNI Libraries by Architecture
        run: |
          for dir in jni_download/libsimplektble-jni_*; do
            arch="${dir##*-}"
            mkdir -p "jni/$arch"
            mv -v "$dir"/* "jni/$arch/"
          done
          find jni -type f -ls

      - name: Publish SimpleKtBLE to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          utils/gradle/gradlew -p simplektble -Psimplektble.jvmNativeLibs=$GITHUB_WORKSPACE/jni --no-daemon \
            publishAndReleaseToMavenCentral

  publish-rust:
    needs: [publish-release]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-22.04

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Environment (Linux)
        run: |
          sudo -H apt-get update -y
          sudo -H apt-get install -y libdbus-1-dev

      - name: Add Version Suffix
        uses: ./.github/actions/setup-version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Attribute README links to crates.io
        run: sed -i 's/utm_source=github/utm_source=crates_io/g' simplersble/README.md

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --allow-dirty
