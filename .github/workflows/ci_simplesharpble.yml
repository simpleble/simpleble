name: Build SimpleSharpBLE

on:
  # CI Main supplies the SimpleCBLE artifacts, including for manual runs.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: 'libsimplecble_@(windows-@(x64|aarch64)|linux-@(x64|aarch64)|macos-aarch64|@(ios|iossimulator|maccatalyst)-aarch64|android-@(arm64-v8a|x86_64))'
          path: artifacts
          merge-multiple: true
      - name: Stage SimpleCBLE libraries
        run: |
          $targets = @(
            @{ Artifact = 'windows-x64'; Rid = 'win-x64'; Libraries = 'shared/bin/*.dll' },
            @{ Artifact = 'windows-aarch64'; Rid = 'win-arm64'; Libraries = 'shared/bin/*.dll' },
            @{ Artifact = 'macos-aarch64'; Rid = 'osx-arm64'; Libraries = 'shared/lib/*.dylib' },
            @{ Artifact = 'ios-aarch64'; Rid = 'ios-arm64'; Libraries = 'static/lib/*.a' },
            @{ Artifact = 'iossimulator-aarch64'; Rid = 'iossimulator-arm64'; Libraries = 'static/lib/*.a' },
            @{ Artifact = 'maccatalyst-aarch64'; Rid = 'maccatalyst-arm64'; Libraries = 'static/lib/*.a' },
            @{ Artifact = 'android-arm64-v8a'; Rid = 'android-arm64'; Libraries = 'shared/lib/*.so' },
            @{ Artifact = 'android-x86_64'; Rid = 'android-x64'; Libraries = 'shared/lib/*.so' },
            @{ Artifact = 'linux-x64'; Rid = 'linux-x64'; Libraries = 'shared/lib/*.so*' },
            @{ Artifact = 'linux-aarch64'; Rid = 'linux-arm64'; Libraries = 'shared/lib/*.so*' }
          )
          foreach ($target in $targets) {
            $source = "$env:RUNNER_TEMP/simplecble-$($target.Artifact)"
            Expand-Archive "artifacts/libsimplecble_$($target.Artifact).zip" -DestinationPath $source
            $destination = "native/$($target.Rid)/native"
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item "$source/$($target.Libraries)" -Destination $destination
          }
      - name: Build Apple static-link bindings
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $output = "$env:RUNNER_TEMP/simplesharpble-static"
          dotnet build simplesharpble -c Release -p:SimpleSharpBLEStaticLink=true -o $output
          foreach ($rid in 'ios-arm64', 'iossimulator-arm64', 'maccatalyst-arm64') {
            $destination = "native/$rid/lib/net10.0"
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item "$output/SimpleSharpBLE.dll" -Destination $destination
          }
      - name: Attribute README links to NuGet
        run: (Get-Content simplesharpble/README.md -Raw).Replace('utm_source=github', 'utm_source=nuget') | Set-Content -NoNewline simplesharpble/README.md
      - name: Pack native libraries
        run: dotnet pack simplesharpble -c Release "-p:NativeLibrariesDirectory=$pwd/native" -o simplesharpble/artifacts
      - name: Build examples
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Get-ChildItem examples/simplesharpble/*.cs | ForEach-Object {
            dotnet build $_.FullName -c Release --artifacts-path "$pwd/build_simplesharpble_examples/$($_.BaseName)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleSharpBLE-nuget
          path: simplesharpble/artifacts/*.nupkg
          if-no-files-found: error
