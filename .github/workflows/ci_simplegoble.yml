name: Build SimpleGoBLE

on:
  workflow_call:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  plain:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: simplegoble/go.mod
          cache-dependency-path: simplegoble/go.sum
      - name: Build and install PLAIN shared libraries
        run: |
          cmake -S simplecble -B build_simplegoble_plain -DSIMPLEBLE_PLAIN=ON -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build_simplegoble_plain --config Release --parallel 4
          cmake --install build_simplegoble_plain --config Release --prefix "$PWD/install_simplegoble_plain"
      - name: Test with cgo disabled
        working-directory: simplegoble
        run: |
          test -d ../install_simplegoble_plain
          go test -v ./...
          go vet ./...

  package:
    needs: plain
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-version
      - uses: actions/setup-go@v5
        with:
          go-version-file: simplegoble/go.mod
          cache-dependency-path: simplegoble/go.sum
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l simplegoble examples/simplegoble)
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: 'libsimplecble_@(macos|linux|windows)-@(x64|aarch64)'
          path: native-artifacts
          merge-multiple: true
      - name: Copy Go sources and examples
        run: |
          package_dir=build_simplegoble_package
          mkdir -p "$package_dir/examples"
          cp simplegoble/*.go simplegoble/go.mod simplegoble/go.sum simplegoble/README.md "$package_dir/"
          sed -i 's/utm_source=github/utm_source=pkg_go_dev/g' "$package_dir/README.md"
          cp -R simplegoble/internal simplegoble/tests "$package_dir/"
          cp LICENSE.md "$package_dir/LICENSE"
          cp VERSION "$package_dir/VERSION"
          echo "$GITHUB_SHA" > "$package_dir/SOURCE_REVISION"
          for example in examples/simplegoble/*/; do
            cp -R "${example%/}" "$package_dir/examples/"
          done
          major=${VERSION%%.*}
          module=github.com/simpleble/simplegoble
          if (( major >= 2 )); then
            module="$module/v$major"
            find "$package_dir" -type f \( -name '*.go' -o -name go.mod -o -name README.md \) \
              -exec sed -i "s|github.com/simpleble/simplegoble|$module|g" {} \;
          fi
      - name: Embed native libraries for each platform
        run: |
          while read -r target archive folder extension c_library core_library; do
            native_dir="build_simplegoble_package/internal/bindings/native/$target"
            mkdir -p "$native_dir"
            archive="native-artifacts/libsimplecble_$archive.zip"
            test -f "$archive"
            while IFS= read -r entry; do
              name=${entry##*/}
              # Accept only direct library files, without archive paths or symlinks.
              if [[ "$entry" != "shared/$folder/$name" || ! "$name" =~ ^[a-zA-Z0-9._+-]+$ ]]; then continue; fi
              if [[ "$name" != *.$extension && "$name" != *.$extension.* ]]; then continue; fi
              test ! -e "$native_dir/$name"
              unzip -p "$archive" "$entry" > "$native_dir/$name"
            done < <(unzip -Z1 "$archive")
            test -s "$native_dir/$c_library"
            test -s "$native_dir/$core_library"
            cat > "build_simplegoble_package/internal/bindings/bundle_$target.go" <<EOF
          // Code generated by SimpleBLE packaging CI. DO NOT EDIT.
          //go:build ${target%_*} && ${target#*_}

          package bindings

          import "embed"

          //go:embed native/$target/*
          var platformLibraries embed.FS

          func init() {
              bundledLibraries = platformLibraries
          }
          EOF
          done <<'TARGETS'
          darwin_amd64 macos-x64 lib dylib libsimplecble.dylib libsimpleble.dylib
          darwin_arm64 macos-aarch64 lib dylib libsimplecble.dylib libsimpleble.dylib
          linux_amd64 linux-x64 lib so libsimplecble.so libsimpleble.so
          linux_arm64 linux-aarch64 lib so libsimplecble.so libsimpleble.so
          windows_amd64 windows-x64 bin dll simplecble.dll simpleble.dll
          windows_arm64 windows-aarch64 bin dll simplecble.dll simpleble.dll
          TARGETS
          gofmt -w build_simplegoble_package/internal/bindings/bundle_*.go
      - name: Test packaged module
        working-directory: build_simplegoble_package
        run: go test -v ./...
      - name: Compile every packaged target without cgo
        working-directory: build_simplegoble_package
        run: |
          for native_dir in internal/bindings/native/*; do
            target=${native_dir##*/}
            GOOS="${target%_*}" GOARCH="${target#*_}" go test -c -o "$RUNNER_TEMP/$target/" ./...
          done
      - name: Create Go module archive
        run: |
          module=$(sed -n 's/^module //p' build_simplegoble_package/go.mod)
          module_dir="build_simplegoble_archive/$module@v$VERSION"
          mkdir -p "$module_dir" artifacts
          cp -R build_simplegoble_package/. "$module_dir/"
          cd build_simplegoble_archive
          zip -qrD "$GITHUB_WORKSPACE/artifacts/simplegoble-$VERSION.zip" github.com/
      - name: Upload Go module
        uses: actions/upload-artifact@v4
        with:
          name: simplegoble-module
          path: artifacts/simplegoble-*.zip
          if-no-files-found: error
