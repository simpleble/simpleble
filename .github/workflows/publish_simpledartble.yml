name: Publish SimpleDartBLE

# pub.dev only accepts uploads from GitHub Actions runs on a tag, so CI Main runs this workflow on the tag of a
# published release. It uploads the SimpleDartBLE and SimpleFltBLE packages that CI Main built and attached to that
# release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # NOTE: With the id-token permission, setup-dart signs pub in to pub.dev
      # with GitHub's OIDC token, which pub.dev checks against the tag.
      - uses: dart-lang/setup-dart@v1

      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Run this workflow on the vX.Y.Z tag of a published release."
            exit 1
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir package \
            --pattern "simpledartble-${BASH_REMATCH[1]}.tar.gz"

      - name: Publish to pub.dev
        working-directory: package
        run: |
          tar -xzf simpledartble-*.tar.gz
          # simplefltble depends on the simpledartble version just published.
          for package in simpledartble simplefltble; do
            version=$(sed -n 's/^version: //p' "$package/pubspec.yaml")
            if curl -sf "https://pub.dev/api/packages/$package/versions/$version" > /dev/null; then
              echo "$package $version is already published."
              continue
            fi
            if [[ "$package" == simplefltble ]]; then tool=flutter; else tool=dart; fi
            (cd "$package" && "$tool" pub publish --force)
          done
