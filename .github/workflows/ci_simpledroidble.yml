name: Build SimpleDroidBLE

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:

  build-lib:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add Version Suffix
        uses: ./.github/actions/setup-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build simplebledroidble AAR
        run: ./simpledroidble/gradlew -p ./simpledroidble build --no-daemon

      - name: Publish Maven artifacts locally
        env:
          LOCAL_MAVEN_REPOSITORY: ${{ runner.temp }}/simpledroidble-maven
        run: |
          ./simpledroidble/gradlew -p ./simpledroidbridge -Dmaven.repo.local=$LOCAL_MAVEN_REPOSITORY --no-daemon publishToMavenLocal
          ./simpledroidble/gradlew -p ./simpledroidble -Dmaven.repo.local=$LOCAL_MAVEN_REPOSITORY --no-daemon :simpledroidble:publishToMavenLocal

      - name: Verify Maven artifacts
        env:
          LOCAL_MAVEN_REPOSITORY: ${{ runner.temp }}/simpledroidble-maven
        run: |
          version=$(tr -d ' \t\n\r' < VERSION)
          for module in simpledroidbridge simpledroidble; do
            module_dir="$LOCAL_MAVEN_REPOSITORY/org/simpleble/$module/$version"
            for artifact in \
              "$module-$version.aar" \
              "$module-$version.pom" \
              "$module-$version-sources.jar" \
              "$module-$version-javadoc.jar"; do
              test -s "$module_dir/$artifact"
              case "$artifact" in
                *.aar|*.jar) unzip -tq "$module_dir/$artifact" ;;
              esac
            done
          done

          pom="$LOCAL_MAVEN_REPOSITORY/org/simpleble/simpledroidble/$version/simpledroidble-$version.pom"
          awk -v version="$version" '
            /<dependency>/ { dependency = "" }
            { dependency = dependency $0 "\n" }
            /<\/dependency>/ {
              if (dependency ~ "<groupId>org.simpleble</groupId>" &&
                  dependency ~ "<artifactId>simpledroidbridge</artifactId>" &&
                  dependency ~ "<version>" version "</version>") found = 1
            }
            END { exit !found }
          ' "$pom"
          grep -F '<artifactId>core-ktx</artifactId>' "$pom"
          grep -F '<artifactId>kotlinx-coroutines-core</artifactId>' "$pom"

          aar="$LOCAL_MAVEN_REPOSITORY/org/simpleble/simpledroidble/$version/simpledroidble-$version.aar"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$aar" | grep -F "jni/$abi/libsimpleble-jni.so"
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test SimpleDroidBLE PLAIN backend
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./simpledroidble/gradlew -p ./simpledroidble :simpledroidble:connectedPlainAndroidTest --no-daemon

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simpledroidble-test-reports
          path: |
            simpledroidble/simpledroidble/build/reports/androidTests
            simpledroidble/simpledroidble/build/outputs/androidTest-results

      - name: Package Artifact
        uses: ./.github/actions/package-native
        with:
          source-dir: simpledroidble/simpledroidble/build/outputs/aar
          output-dir: $GITHUB_WORKSPACE/artifacts
          archive-name: simpledroidble
          os: linux

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: simpledroidble
          path: artifacts/simpledroidble.zip

  build-examples:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add Version Suffix
        uses: ./.github/actions/setup-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build simplebledroidble examples AAR
        run: gradle build -p ./examples/simpleble-android --no-daemon

