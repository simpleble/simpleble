name: 'Set Build Version'
description: 'Sets the build version in project manifests'

runs:
  using: 'composite'
  steps:
    - name: Update version files
      shell: bash
      run: |
        # Configure Git to trust this repository
        git config --global --add safe.directory $GITHUB_WORKSPACE

        # Read the base version from the VERSION file
        version_str=$(cat VERSION | tr -d ' \t\n\r')

        # Only a published GitHub release produces a stable version, and its tag names that version. A branch push may
        # see a tag created at the same time, so checking only whether HEAD is tagged can accidentally publish the
        # stable version twice.
        if [[ "${GITHUB_EVENT_NAME:-}" == "release" ]]; then
          if [[ ! "${GITHUB_REF:-}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Error: The release tag (${GITHUB_REF:-}) is not vX.Y.Z." >&2
            exit 1
          fi
          version_str="${BASH_REMATCH[1]}"
        else
          # Other builds are development versions of the release VERSION names. Its -dev suffix marks local builds,
          # which CI replaces with the number of commits since the last tag. Starting from HEAD^ keeps the version of a
          # commit that is built again after being tagged.
          version_str=${version_str%-dev}
          latest_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            echo "Error: No tags found in the repository history." >&2
            exit 1
          fi
          commits=$(git rev-list --count "${latest_tag}"..HEAD)
          # NOTE: The dot makes the commit count its own identifier, which semver compares as a number.
          # Without it, Go and Cargo compare "dev94" and "dev135" as text and rank dev94 higher.
          version_str="${version_str}-dev.${commits}"
        fi

        # Use a backup suffix for compatibility with both GNU and BSD sed,
        # then remove the backup.
        echo "$version_str" > VERSION
        sed -i.bak 's/^version = .*/version = "'"$version_str"'"/' Cargo.toml
        rm Cargo.toml.bak
        sed -i.bak 's/^version = .*/version = "'"$version_str"'"/' simpleaible/pyproject.toml
        rm simpleaible/pyproject.toml.bak
        sed -i.bak 's/^  "version": ".*",$/  "version": "'"$version_str"'",/' simplejsble/package.json
        rm simplejsble/package.json.bak
        sed -i.bak 's/^  "version": ".*",$/  "version": "'"$version_str"'",/' simplernble/package.json
        rm simplernble/package.json.bak
        sed -i.bak 's/^version: .*/version: '"$version_str"'/' simpledartble/pubspec.yaml
        rm simpledartble/pubspec.yaml.bak
        # simplefltble depends on the simpledartble of the same version.
        sed -i.bak -e 's/^version: .*/version: '"$version_str"'/' \
          -e 's/^  simpledartble: .*/  simpledartble: '"$version_str"'/' simplefltble/pubspec.yaml
        rm simplefltble/pubspec.yaml.bak
        echo "Updated VERSION file to: $version_str"
        grep '^version = ' Cargo.toml
        grep '^version = ' simpleaible/pyproject.toml
        grep '^  "version": ' simplejsble/package.json
        grep '^  "version": ' simplernble/package.json
        grep '^version: ' simpledartble/pubspec.yaml
        grep -E '^version: |^  simpledartble: ' simplefltble/pubspec.yaml
        echo "VERSION=$version_str" >> $GITHUB_ENV
